name: Deploy Vibee - PROD

on:
  push:
    branches: [ "master" ]

jobs:
  deploy_prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Publish
        run: |
          dotnet restore Vibee.csproj
          dotnet publish Vibee.csproj -c Release -o publish

      - name: Zip publish
        run: |
          cd publish
          zip -r ../vibee.zip .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload zip
        run: |
          scp -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_ed25519 \
            vibee.zip ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"D:/deploy/incoming/vibee.zip"

      - name: Deploy on server (PROD)
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'powershell -ExecutionPolicy Bypass -File "D:\deploy\scripts\deploy.ps1" -ZipPath "D:\deploy\incoming\vibee.zip" -SiteName "Vibee" -DestPath "D:\sites\Vibee"'
