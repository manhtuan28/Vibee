name: Deploy Vibee - TEST

on:
  push:
    branches: [ "test" ]

jobs:
  deploy_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Publish
        run: |
          dotnet restore Vibee.csproj
          dotnet publish Vibee.csproj -c Release -o publish

      - name: Zip publish
        run: |
          cd publish
          zip -r ../vibee-test.zip .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          tr -d '\r' < ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.clean
          mv ~/.ssh/id_ed25519.clean ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload zip
        run: |
          scp -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_ed25519 \
            vibee-test.zip ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"D:/deploy/incoming/vibee-test.zip"

      - name: Deploy on server (TEST)
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'powershell -ExecutionPolicy Bypass -File "D:\deploy\scripts\deploy.ps1" -ZipPath "D:\deploy\incoming\vibee-test.zip" -SiteName "VibeeTest" -DestPath "D:\sites\Vibee-Test"'